<svg width="144" height="144" viewBox="0 0 144 144" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- glow at the aperture: reads as a firefly's light and as a skylight's sun disc -->
    <radialGradient id="swietlik-mark-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.55" stop-color="#FFD08A" />
      <stop offset="1" stop-color="#FFB84D" />
    </radialGradient>
    <!-- light spilling downward from the aperture, dissipating as it falls -->
    <linearGradient id="swietlik-mark-cone" x1="72" y1="58" x2="72" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB84D" stop-opacity="0.9" />
      <stop offset="1" stop-color="#FFB84D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- downward-pointing light cone: skylight beam / firefly's trailing glow -->
  <path d="M72 58L118 132H26L72 58Z" fill="url(#swietlik-mark-cone)" />

  <!-- circular aperture: skylight opening / firefly body -->
  <circle cx="72" cy="42" r="26" fill="url(#swietlik-mark-glow)" />
  <circle cx="72" cy="42" r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" />
</svg>
